version: '3.8'

services:
  item-app:
    image: panggihdwialamsyah/item-app:v1
    ports:
      - "80:8080"
    depends_on:
      - item-db
    restart: always  # Restart container jika berhenti

  item-db:
    image: mongo:3
    volumes:
      - app-db:/data/db
    restart: always  # Restart container jika berhenti

volumes:
  app-db:
