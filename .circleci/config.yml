# Konfigurasi versi CircleCI yang digunakan
version: 2.1

# Definisi executor untuk job dengan bahasa Go
executors:
  go-executor:
    docker:
      - image: cimg/go:1.20  # Image Docker resmi CircleCI dengan Go versi 1.20

# Definisi job untuk melakukan linting terhadap Dockerfile menggunakan hadolint
jobs:
  lint-dockerfile:
    docker:
      # Menggunakan image ringan Alpine Linux
      - image: alpine
    steps:
    # Mengambil source code dari repositori
      - checkout  
      - run:
        # Instalasi hadolint untuk linting Dockerfile
          name: Install hadolint
          command: |
            apk add --no-cache curl
            curl -Lo /bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x /bin/hadolint
      - run:
      # Menjalankan linting terhadap Dockerfile
          name: Lint Dockerfile  
          command: hadolint Dockerfile

  # Job untuk menjalankan unit test pada aplikasi Go
  test-app:
    executor: go-executor
    steps:
      - checkout
      - run:
      # Menjalankan pengujian unit pada seluruh package Go
          name: Run Go Unit Tests  
          command: go test -v -short --count=1 $(go list ./...)

  # Job untuk membangun image Docker dan push ke GitHub Container Registry
  build-app-karsajobs:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
        # Mengaktifkan environment Docker terisolasi
      - setup_remote_docker
      - run:
      # Build image dan push ke GitHub Container Registry
          name: Build and Push to GHCR  
          command: |
            docker build -t ghcr.io/panggihdwialamsyah/karsajobs:latest .
            echo $CR_PAT | docker login ghcr.io -u panggihdwialamsyah --password-stdin
            docker push ghcr.io/panggihdwialamsyah/karsajobs:latest

# Definisi workflow utama yang menjalankan seluruh job secara berurutan
workflows:
  karsajobs:
    jobs:
      - lint-dockerfile
      - test-app
      - build-app-karsajobs
